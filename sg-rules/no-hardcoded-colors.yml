id: no-hardcoded-colors
message: Do not hardcode hex or rgb colors. Use color.* tokens from @/tokens/token-consts.stylex.ts.
severity: error
language: Tsx
rule:
  all:
    - kind: string_fragment
    - regex: '^(#[0-9a-fA-F]{3,8}|rgba?\()'
    - inside:
        kind: call_expression
        stopBy: end
files:
  - "src/**/*.ts"
  - "src/**/*.tsx"
