id: no-ui-imports-features
language: Tsx
severity: error
message: |
  `components/ui`, `lib` or `tokens` imported a feature, an app module or the work app (`@internal/`).
  General-purpose code must not depend on product surfaces. Move the dependency into the feature that owns it.
  UI primitives can import only from `tokens/`, `lib/` and other `components/ui/` files.
rule:
  any:
    - all:
        - kind: string_fragment
        - regex: '^@/(features|app)/|^@internal/'
        - inside:
            kind: import_statement
            stopBy: end
files:
  - "src/components/**"
  - "src/lib/**"
  - "src/tokens/**"
