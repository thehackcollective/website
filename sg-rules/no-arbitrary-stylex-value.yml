id: no-arbitrary-stylex-value
language: Tsx
severity: error
message: |
  A scale property inside `stylex.create()` has a literal value. Use a token.

    fontSize: '13px'          ->  fontSize: text.sizeUi
    padding: 18               ->  padding: space.md
    borderRadius: '6px'       ->  borderRadius: radius.sm
    gap: '0.5rem'             ->  gap: space.xs

  Each literal adds a new scale step that has no name and no review.
  Three of them cause the type scale to drift again. ENG-1248 exists to stop that failure.
  In that failure, three files used different display sizes: 72px, 44px and 48px.

  If the value does not exist, add it to the token files in `src/tokens/`.
  Then the new step has a name, a review and one shared source.

  The StyleX ESLint plugin `propLimits` (`eslint.prop-limits.json`) does the same check on `*.stylex.ts` files.
  This rule checks `stylex.create()` in `.tsx` components. The ESLint step does not read those files.
rule:
  kind: pair
  all:
    - has:
        field: key
        regex: '^(fontSize|lineHeight|letterSpacing|borderRadius|padding|paddingBlock|paddingInline|paddingTop|paddingBottom|paddingLeft|paddingRight|margin|marginBlock|marginInline|marginTop|marginBottom|marginLeft|marginRight|gap|rowGap|columnGap)$'
    - has:
        field: value
        any:
          - kind: string
          - kind: number
    - not:
        has:
          field: value
          regex: '^[''"]?(0|auto|normal|1)[''"]?$'
    - inside:
        stopBy: end
        pattern: stylex.create($$$)
note: |
  The values `0`, `auto`, `normal` and unitless `1` are allowed.
  Zero has no unit. `auto` is layout (margin centering). `normal` is the CSS default for letter-spacing.
  Unitless line-height `1` is leading-none.
  The `propLimits` allowlist in eslint.prop-limits.json is the main gate, and it also allows these values.

  The files in `ignores` are old settings dialogs.
  They style dialog chrome with values tuned per element, and they are older than the token scale.
  connections-dialog.tsx had the most hits (34).
  The dialog split moved part of that chrome into connections-list-body.tsx and connections-dialog-header.tsx (28 hits).
  New dialog code must use tokens. Do not add files to `ignores`.
files:
  - "internal/**/*.tsx"
  - "workers/internal/**/*.tsx"
  - "src/components/ui/**/*.tsx"
  - "src/lib/**/*.tsx"
ignores:
  - "**/node_modules/**"
  - "src/components/ui/{count-up,dia-sweep,dia-text,reveal,stagger-reveal}.tsx"
  - "src/components/ui/{count-up,dia-sweep,dia-text,reveal,stagger-reveal}.ts"
  - "src/components/ui/{count-up,dia-sweep,dia-text,reveal,stagger-reveal}.stylex.ts"
  - "src/lib/hairline-*"
