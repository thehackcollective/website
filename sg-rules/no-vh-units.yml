id: no-vh-units
message: Use dvh not vh. Mobile browser chrome makes vh taller than the visible viewport.
severity: error
language: Tsx
rule:
  all:
    - kind: string_fragment
    - regex: '\dvh'
    - inside:
        kind: call_expression
        stopBy: end
files:
  - "src/**/*.ts"
  - "src/**/*.tsx"
