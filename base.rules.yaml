roots: [src, internal, workers, scripts]
extensions: [.ts, .tsx, .mjs, .js]
baselines: scripts/c/_lib/baselines
vendored:
  - ".agents/skills/**"
  - "src/lib/hairline-*.js"
guarded:
  gates: [c, scripts/c/check, scripts/c/merge, scripts/c/_lib/scanner.py, scripts/c/_lib/structure.sh, scripts/c/_lib/import-cycles.sh, scripts/c/_lib/import_edges.py, scripts/git-hooks/pre-commit, scripts/git-hooks/pre-push, sgconfig.yml]
  tsconfig: [tsconfig.json, scripts/tsconfig.json]
  biome: [biome.json, import-cycles.biome.json]
  sg-rules: [sg-rules]
  skip-lists: [knip.json, .jscpd.json, doctor.config.json, biome.json, import-cycles.biome.json, eslint.config.mjs, tsconfig.json, scripts/tsconfig.json]
limits:
  jscpd-clones-max: 0
  jscpd-dup-lines-max: 0
  jscpd-dup-tokens-max: 0
  health-score-min: 90
aliases:
  src:
    "@/ui/": src/components/ui/
    "@/": src/
  internal:
    "@/ui/": src/components/ui/
    "@internal/": internal/
    "@/": src/
  workers:
    "@/ui/": src/components/ui/
    "@internal/": internal/
    "@/": src/

rules:
- id: web-coachmark-coverage
  catalog: 7
  check: coachmark-coverage
  scope: [internal/work/features/*/entrypoint.ts, internal/work/features/*/coachmarks.ts]
  baseline: none
  message: >
    A rail page has no coachmark step. Each nav entry with a portals list is a rail page. Add one to three steps for its nav id to COACHMARKS in workspace/coachmarks.ts of the feature that owns the page.
- id: web-coachmark-anchors
  catalog: 7
  check: coachmark-anchors
  scope: [internal/work/features/*/coachmarks.ts, internal/work/features/*/*.tsx]
  baseline: none
  message: >
    A coachmark step and its anchor do not agree. Each step anchor is a literal '<feature>.<id>'. The same feature workspace must render data-coachmark="<feature>.<id>" as a literal on a real element. Each data-coachmark must have a step. Each COACHMARKS key must be a rail page id of that feature. Add the missing attribute or step, or remove the extra one.
- id: app-page-frame-reserved
  catalog: 2
  check: regex
  pattern: (--thc-page-frame|layout\.pageFrame)
  scope: [internal/**, workers/internal/**, src/components/ui/**, src/lib/**, src/tokens/design-tokens.css, src/tokens/semantic-tokens.css, src/tokens/component-tokens.css, src/tokens/webapp-globals.css, src/tokens/token-consts.stylex.ts]
  universe: tracked
  baseline: none
  examples:
    bad: ['maxWidth: layout.pageFrame', '--thc-page-frame: 1120px']
    good: ['maxWidth: ''68ch''', 'maxWidth: layout.siteFrame']
  message: >
    The app page frame is retired. Remove it. Let data surfaces fill the main column. Use a character measure for text and a named layout token for an overlay.
- id: web-no-glass-effects
  catalog: 2
  check: regex
  pattern: (?i)backdrop-?filter|glass|liquid|liquef|fedisplacementmap|feturbulence|blur\(\s*[0-9]
  scope: [internal/**, workers/internal/**, src/components/ui/**, src/lib/**, src/tokens/design-tokens.css, src/tokens/semantic-tokens.css, src/tokens/component-tokens.css, src/tokens/webapp-globals.css, src/tokens/token-consts.stylex.ts]
  exempt: [src/components/ui/primitive-styles.stylex.ts, src/tokens/**, src/tokens/webapp-globals.css, 'src/components/ui/{count-up,dia-sweep,dia-text,reveal,stagger-reveal}.tsx', 'src/components/ui/{count-up,dia-sweep,dia-text,reveal,stagger-reveal}.ts', 'src/components/ui/{count-up,dia-sweep,dia-text,reveal,stagger-reveal}.stylex.ts', src/lib/hairline-*]
  universe: tracked
  baseline: none
  examples:
    bad: ['backdropFilter: ''blur(12px)''', 'backgroundColor: color.backgroundGlass', 'import { LiquidButton } from ''@/ui/liquid-button''', 'filter: ''blur(4px)''']
    good: ['backgroundColor: color.backgroundSurface', <Button variant="primary">Book a Call</Button>, 'inputRef.current?.blur()']
  message: >
    Do not use glass, liquid or blur effects in the web app. Remove backdropFilter, blur filters, glass tokens and Liquefy code. Use an opaque surface (color.backgroundSurface or color.backgroundCanvas) with a color.borderDefault hairline. A primary action is a Button with variant primary. See DESIGN.md, Surfaces and elevation.
- id: web-app-no-shadows
  catalog: 2
  check: regex
  pattern: (?i)(box|text)-?shadow\s*:(?!\s*(['"]?(none|null)\b|\{|layout\.focusRing\b))|\bshadow\.|\bshadow\[|--thc-shadow-|drop-?shadow
  scope: [internal/**, workers/internal/**, src/components/ui/**, src/lib/**, src/tokens/design-tokens.css, src/tokens/semantic-tokens.css, src/tokens/component-tokens.css, src/tokens/webapp-globals.css, src/tokens/token-consts.stylex.ts]
  exempt: [internal/work/shell/**, src/tokens/**, src/components/ui/**, 'src/components/ui/{count-up,dia-sweep,dia-text,reveal,stagger-reveal}.tsx', 'src/components/ui/{count-up,dia-sweep,dia-text,reveal,stagger-reveal}.ts', 'src/components/ui/{count-up,dia-sweep,dia-text,reveal,stagger-reveal}.stylex.ts', src/lib/hairline-*]
  universe: tracked
  baseline: none
  examples:
    bad: ['boxShadow: shadow.float', 'boxShadow: `0 0 0 1px ${color.borderDefault}`', 'default: shadow[''2''],', 'filter: ''drop-shadow(0 1px 2px #0003)''']
    good: ['boxShadow: { default: null, '':focus-visible'': layout.focusRing }', 'boxShadow: ''none''', <Card> from @/ui/card]
  message: >
    Do not write a shadow in an app feature. Depth comes from the ui/ components (Card, menus, popovers, dialogs), which use the layered shadow tokens. The focus ring (layout.focusRing) is the only box-shadow that a feature can use.
- id: web-ui-shadow-is-token
  catalog: 2
  check: regex
  pattern: (?is)drop-?shadow|(?:box|text)-?shadow\s*:\s*(?:\{[^{}]*?)?['\"`][^'\"`]*?(?<![\w.%-])(?:-?\d*\.?\d+(?:px|rem|em)|0)\s+(?:-?\d*\.?\d+(?:px|rem|em)|0)(?![\w%(])|(?:box|text)-shadow\s*:\s*[^;'\"`{}]*?(?<![\w.%-])(?:-?\d*\.?\d+(?:px|rem|em)|0)\s+(?:-?\d*\.?\d+(?:px|rem|em)|0)(?![\w%(])|['\"`][^'\"`\n]*?(?<![\w.%-])(?:-?\d*\.?\d+(?:px|rem|em)|0)\s+(?:-?\d*\.?\d+(?:px|rem|em)|0)(?![\w%(])[^'\"`\n]*?(?:#[0-9a-f]{3,8}\b|rgba?\(|hsla?\(|oklch\(|var\(|\$\{color\.|\b(?:black|white|transparent|currentcolor)\b)[^'\"`\n]*['\"`]
  scope: [src/components/ui/**]
  universe: tracked
  baseline: none
  examples:
    bad: ['boxShadow: `0 0 0 1px ${color.borderDefault}`', 'boxShadow: ''0 1px 2px var(--x)''', 'boxShadow: ''0 4px 8px black''', 'boxShadow: ''0 1px 2px #0000001a''', 'filter: ''drop-shadow(0 1px 2px #0003)''']
    good: ['boxShadow: shadow[''4'']', 'boxShadow: { default: shadow[''2''], '':focus-visible'': layout.focusRing }']
  message: >
    A ui/ component takes depth only from a layered shadow token (shadow.* from src/tokens/token-consts.stylex.ts). Do not write a raw shadow value: a string with two or more lengths in a shadow property, or with lengths and a color. See docs/decisions/2026-11-11-work-neutral-theme.md.
  exempt: ['src/components/ui/{count-up,dia-sweep,dia-text,reveal,stagger-reveal}.tsx', 'src/components/ui/{count-up,dia-sweep,dia-text,reveal,stagger-reveal}.ts', 'src/components/ui/{count-up,dia-sweep,dia-text,reveal,stagger-reveal}.stylex.ts', src/lib/hairline-*]
- id: web-cross-feature-via-index
  catalog: 2
  check: import-boundary
  scope: [internal/**]
  owner: internal/work/features/([^/]+)/
  forbid: [internal/work/features/*/**]
  allow: ['internal/work/features/{self}/**', internal/work/features/*/index.ts]
  baseline: none
  message: >
    An import from a different feature uses the public edge '@/features/<name>' (its index.ts). Export the symbol there. Never import from the workspace/ of a different feature.
- id: absolute-imports
  catalog: 4
  check: regex
  pattern: (?:from|import)\s*\(?\s*['"]\.\./
  scope: [src/**, internal/**, workers/**]
  baseline: none
  examples:
    bad: ['import { readJson } from ''../shared/json''']
    good: ['import { readJson } from ''@/shared/json''']
  message: >
    Import by absolute path ('@/features/<name>/routes', '@/shared/env', '@/lib/...'). Never use '../'. You can use a sibling import './x' in the same folder.
- id: named-exports-only
  catalog: 5
  check: regex
  pattern: ^export\s+default\b
  scope: [src/**, internal/**, workers/**]
  exempt: [workers/internal/index.ts, internal/cloudflare.config.ts, internal/vite.config.ts]
  baseline: none
  examples:
    bad: ['export default function View() {}']
    good: ['export function View() {}']
  message: >
    Use a named export (export function X or export const X), so that agents can find it with grep. Reserved feature files export reserved names (reserved-*-export). Worker entry files are exempt, because the runtime requires a default export.
- id: repo-root-allowlist
  catalog: 59
  check: path
  universe: tracked
  pattern: ^(?!(?:\.agents|\.claude|docs|internal|public|scripts|sg-rule-tests|sg-rules|src|workers)/|(?:\.gitignore|\.jscpd\.json|\.node-version|cloudflare\.config\.ts|\.syncpackrc\.json|AGENTS\.md|CLAUDE\.md|DESIGN\.md|README\.md|base\.rules\.yaml|biome\.json|bun\.lock|bunfig\.toml|c|doctor\.config\.json|eslint\.config\.mjs|eslint\.prop-limits\.json|import-cycles\.biome\.json|index\.html|knip\.json|package\.json|sgconfig\.yml|skills-lock\.json|tsconfig\.json|vite\.config\.ts)$)
  baseline: none
  examples:
    bad: [.greptile/config.json, notes.md]
    good: [src/main.tsx, base.rules.yaml]
  message: >
    The repo root holds only the entries that this rule lists, dot entries included. Do not add a config file for a tool so that it skips files. vendored in base.rules.yaml is the one list of exceptions. A new root entry changes this rule, so it goes in its own PR with the reason.
- id: no-nested-biome-config
  catalog: 59
  check: path
  universe: tracked
  pattern: (^|/)\.?biome\.jsonc?$
  scope: [src/**, internal/**, workers/**]
  baseline: none
  examples:
    bad: [src/features/website/biome.json, internal/work/features/tasks/biome.jsonc]
    good: [biome.json, import-cycles.biome.json]
  message: >
    A biome config file under src can turn off a lint rule, for example noImportCycles, for one folder. Each app has its biome config files in the app folder only. Delete the file. Put the change in the biome.json of the app, where the guarded config check reads it.
- id: kebab-case-filenames
  catalog: 6
  check: path
  pattern: /[^/]*[A-Z][^/]*\.tsx?$
  scope: [src/features/**, internal/**, workers/**]
  baseline: none
  examples:
    bad: [internal/work/features/tasks/workspace/TaskList.tsx]
    good: [internal/work/features/tasks/workspace/task-list.tsx]
  message: >
    Feature file names are kebab-case (task-drawer.tsx exports TaskDrawer). Rename the file. Then update the files that import it.
- id: reserved-view-export
  catalog: 7
  check: must-match
  pattern: ^export function View\(
  scope: [src/features/*/workspace/view*.tsx]
  baseline: none
  message: >
    A view file exports `export function View()`. features/catalog.ts loads that name for each route. Rename the component to View.
- id: reserved-loading-export
  catalog: 7
  check: must-match
  pattern: ^export function Loading\(
  scope: [src/features/*/workspace/loading.tsx]
  baseline: none
  message: >
    loading.tsx exports `export function Loading()`. The catalog shows it while the view loads.
- id: reserved-error-export
  catalog: 7
  check: must-match
  pattern: ^export function ErrorFallback\(
  scope: [src/features/*/workspace/error.tsx]
  baseline: none
  message: >
    error.tsx exports `export function ErrorFallback()`. The catalog shows it when the view throws an error.
- id: no-use-effect
  catalog: 13
  check: regex
  pattern: \buse(Layout|Insertion)?Effect\b
  scope: [src/**, internal/**]
  exempt: [src/lib/use-mount-effect.ts]
  baseline: none
  examples:
    bad: ['useEffect(() => subscribe(), [])', useLayoutEffect(measure)]
    good: [useMountEffect(() => subscribe())]
  message: >
    Do not use useEffect. Calculate state inline or with useMemo. Handle user actions in event handlers. Reset state with a key. Fetch data through the feature store. For a real external sync at mount time, use useMountEffect from '@/lib/use-mount-effect'.
- id: no-comments
  catalog: 23
  check: comment-ratchet
  scope: [src/**, internal/**, workers/**, scripts/**]
  exempt: ['**/*.d.ts']
  pragmas: (eslint-disable|biome-ignore|react-doctor-disable|@ts-ignore|@ts-expect-error|@ts-nocheck)
  baseline: none
  message: >
    Comments are not permitted. Put the information in a name, a type, or a rule in base.rules.yaml. Then delete the comment.
- id: no-comments-anywhere
  catalog: 23
  check: comment-ratchet
  universe: tracked
  scope: ['**']
  exempt: ['{src,internal,workers,scripts}/**/*.{ts,tsx,js,mjs}', '**/*.d.ts']
  pragmas: ^#USAGE:|(eslint-disable|biome-ignore|@ts-ignore|@ts-expect-error|@ts-nocheck)
  baseline: none
  message: >
    Comments are not permitted in any file. This includes SQL, shell, Python, YAML, JSONC, CSS and config files. Put the information in a name, a rule in base.rules.yaml, the feature-map.md of the owner, or a decision record. Then delete the comment.
- id: doc-refs-resolve
  catalog: 60
  check: doc-refs
  universe: tracked
  scope: ['**/*.md']
  baseline: none
  message: >
    A Markdown file names a repo path or a ./c command in backticks that does not exist. Docs that point at code that moved teach the next agent the wrong place. Write the current path (git ls-files finds it), or delete the sentence if the code is gone.
- id: web-feature-map-sections
  catalog: 61
  check: must-match
  universe: tracked
  pattern: (?s)^## Sub-features$.*^## How to get to it \(user POV\)$.*^## Driving it with agent-browser$.*^## Gotchas$
  scope: [internal/work/features/*/feature-map.md]
  baseline: none
  message: >
    A web feature map has these four H2 headings in this order: Sub-features, How to get to it (user POV), Driving it with agent-browser, Gotchas. The verification skill reads each map in this shape. Add the missing heading or move it into this order.
- id: no-suppressions
  catalog: 26
  check: regex
  pattern: '@ts-ignore|@ts-expect-error|@ts-nocheck|eslint-disable|biome-ignore|react-doctor-disable'
  scope: [src/**, internal/**, workers/**, scripts/**]
  baseline: none
  examples:
    bad: [// @ts-ignore, '// biome-ignore lint/style: legacy']
    good: [const ignored = items.filter(isHidden)]
  message: >
    Suppression comments are not permitted. Fix the error at its cause. If it is a real exception, record a decision. Then make the type narrower.
- id: no-any
  catalog: 27
  check: regex
  pattern: :\s*any\b|\bas\s+any\b|<any\s*[,>]|\bany\[\]
  scope: [src/**, internal/**, workers/**, scripts/**]
  baseline: none
  examples:
    bad: ['function parse(input: any) {}', const rows = data as any]
    good: ['function parse(input: unknown) {}']
  message: >
    Do not use `any`. Type the boundary. Or use `unknown` and narrow it. Or import the real type from its owner.
- id: no-non-null-assertion
  catalog: 28
  check: regex
  pattern: '[\w\)\]]!(?=[.\)\],;\[]|\s*[)\],;])(?!=)'
  scope: [src/**, internal/**, workers/**, scripts/**]
  baseline: none
  examples:
    bad: [const id = user!.id, 'return rows[0]!;']
    good: ['const id = user?.id', <p>Saved!</p>]
  message: >
    `x!` hides a null that the types permit. Handle the null with an early return, a default, or a named error. Or make the type stricter.
- id: one-record-guard
  catalog: 31
  check: regex
  pattern: (function|const)\s+(isRecord|isPlainRecord|isPlainObject|isObjectRecord)\b
  scope: [src/**, internal/**, workers/**, scripts/**]
  exempt: [src/lib/guards.ts]
  baseline: none
  examples:
    bad: ['function isRecord(value: unknown): value is Record<string, unknown> {']
    good: ['import { isRecord } from ''@/shared/json''']
  message: >
    Each app has one record guard. Import isRecord from '@/shared/guards' (api) or '@/lib/guards' (web). Do not write a new one.
- id: no-generic-type-predicate
  catalog: 28
  check: regex
  pattern: \)\s*:\s*\w+\s+is\s+[A-Z]\b(?![\w<.\[])
  scope: [src/**, internal/**, workers/**, scripts/**]
  baseline: none
  examples:
    bad: ['function isT(value: unknown): value is T {']
    good: ['function isTask(value: unknown): value is Task {']
  message: >
    A guard that returns `value is T` for a type parameter T cannot check T at runtime. Thus it is a type assertion. Write a guard for the concrete type. Make it check the fields that the caller reads.
- id: one-schema-library
  catalog: 31
  check: regex
  pattern: (?:from|import)\s*\(?\s*['"](yup|joi|valibot|superstruct|io-ts|arktype|@sinclair/typebox)['"/]
  baseline: none
  examples:
    bad: [import * as yup from 'yup', 'import { object } from ''valibot''']
    good: ['import { z } from ''zod''']
  message: >
    Use one schema library: the library that the codebase uses now. A second schema library needs a decision record first.
- id: no-eval
  catalog: 32
  check: regex
  pattern: \beval\s*\(|\bnew\s+Function\s*\(
  baseline: none
  examples:
    bad: [eval(code), new Function('return 1')]
    good: [evaluate(code)]
  message: >
    Do not build code from strings at runtime. Use a typed dispatch table.
- id: no-process-env
  catalog: 34
  check: regex
  scope: [src/**, internal/**, workers/**]
  pattern: \bprocess\.env\b
  baseline: none
  examples:
    bad: [const key = process.env.API_KEY]
    good: [const key = env.API_KEY]
  message: >
    Workers and the browser have no process.env. Read the binding from Env (shared/env.ts). Or read import.meta.env through config.ts.
- id: no-mutable-export
  catalog: 35
  check: regex
  pattern: ^\s*export\s+(let|var)\b
  baseline: none
  examples:
    bad: [export let count = 0]
    good: [export const count = 0]
  message: >
    Each durable value has one writer. Export a const, or a store with a named command.
- id: no-free-form-console
  catalog: 54
  check: regex
  scope: [src/**, internal/**, workers/**]
  pattern: \bconsole\.(log|debug|info|trace)\s*\(
  baseline: none
  examples:
    bad: ['console.log(''debug'', value)']
    good: ['console.error(JSON.stringify({ event: ''sync.failed'' }))']
  message: >
    Log with console.warn or console.error and a structured object ({ event, ...fields }). Or delete the line.
- id: no-unit-test-files
  catalog: 45
  check: path
  pattern: (\.(test|spec)\.(ts|tsx|mjs|js)$)|/__tests__/
  baseline: none
  examples:
    bad: [src/lib/date.test.ts, workers/internal/__tests__/mail.ts]
    good: [src/lib/date.ts]
  message: >
    This repo writes no unit tests (AGENTS.md). Delete the test file. Prove the behavior with an E2E run (the verification skill). Attach the proof to the PR.
- id: no-test-runner-imports
  catalog: 45
  check: regex
  pattern: from\s+['"](bun:test|vitest|node:test|@jest/globals|@testing-library/[^'"]+|@playwright/test)['"]
  baseline: none
  examples:
    bad: ['import { test, expect } from ''bun:test''', 'import { render } from ''@testing-library/react''']
    good: ['import { z } from ''zod''']
  message: >
    This repo has no unit test runner. Delete the import. Prove the behavior with an E2E run (the verification skill).
- id: web-fetch-behind-api-module
  catalog: 17
  check: regex
  pattern: (?<![\w.])fetch\s*\(
  scope: [internal/**, workers/internal/**, src/components/ui/**, src/lib/**, src/tokens/design-tokens.css, src/tokens/semantic-tokens.css, src/tokens/component-tokens.css, src/tokens/webapp-globals.css, src/tokens/token-consts.stylex.ts]
  exempt: ['**/{api,*-api,api-base}.ts', 'src/components/ui/{count-up,dia-sweep,dia-text,reveal,stagger-reveal}.tsx', 'src/components/ui/{count-up,dia-sweep,dia-text,reveal,stagger-reveal}.ts', 'src/components/ui/{count-up,dia-sweep,dia-text,reveal,stagger-reveal}.stylex.ts', src/lib/hairline-*]
  baseline: none
  examples:
    bad: [const res = await fetch('/api/tasks')]
    good: [const res = await api.get('/tasks')]
  message: >
    Put fetch() in an api.ts, *-api.ts or api-base.ts module. This keeps the host contract typed. Add a function there and call it.
- id: name-by-function
  catalog: 58
  check: path
  pattern: (?:[/._-]|(?<=[a-z0-9])(?=[A-Z]))(?i:zero)s?(?=[/._A-Z-])|^(?!src/components/ui/[^/]+-logo\.tsx$)(?:(?!/(?:providers|adapters)/).)*?(?:[/._-]|(?<=[a-z0-9])(?=[A-Z]))(?i:elevenlabs|deepgram|telnyx|twilio|vapi|agentmail|resend|virustotal|composio|clerk|hostaway|hosthub|guesty|fixflo|calendly|calcom|zoho|meta|gmail|outlook|google|microsoft|ms|jev)s?(?=[/._A-Z-])
  scope: [src/features/**, internal/work/features/**, workers/internal/**, src/lib/**, src/components/ui/**]
  baseline: none
  examples:
    bad: [workers/internal/features/agent/elevenlabs/elevenlabs.ts, internal/work/features/zero/workspace/view.tsx]
    good: [workers/internal/features/agent/providers/elevenlabs.ts, internal/work/features/agent/workspace/view.tsx]
  message: >
    Name a file by its function. Never use a vendor name or a codename (zero), in kebab case or camel case. Rename the file for what it does (speech, phone, email-sender, use-mailbox, auth-token). On web, workspace/ stays flat, so the rename is the fix. A vendor name is permitted only in the path below a providers/ or adapters/ folder (api features and shared: <feature>/providers/<vendor>.ts). It is never permitted above that folder. A brand logo is components/ui/<brand>-logo.tsx. Channels (whatsapp, email, phone, voice) are functions.
- id: web-framework-never-imports-features
  catalog: 2
  check: import-boundary
  scope: ['internal/work/features/*.{ts,tsx}', internal/work/api-base.ts]
  forbid: [internal/work/features/*/**]
  baseline: none
  message: >
    Framework code (internal/work/features/catalog.tsx, internal/work/features/entrypoint.ts and the work api-base module) never imports a feature. Find the feature through import.meta.glob in the catalog. Or move the shared code into lib/.
- id: web-color-literal-in-token-source
  catalog: 62
  check: regex
