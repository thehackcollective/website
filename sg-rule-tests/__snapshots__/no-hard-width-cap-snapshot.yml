id: no-hard-width-cap
snapshots:
  ? |
    stylex.create({
      page: { maxWidth: '1120px' },
    })
  : labels:
    - source: 'maxWidth: ''1120px'''
      style: primary
      start: 26
      end: 44
    - source: maxWidth
      style: secondary
      start: 26
      end: 34
    - source: '''1120px'''
      style: secondary
      start: 36
      end: 44
    - source: |-
        stylex.create({
          page: { maxWidth: '1120px' },
        })
      style: secondary
      start: 0
      end: 50
  ? |
    stylex.create({
      page: { maxWidth: layout.pageFrame },
    })
  : labels:
    - source: 'maxWidth: layout.pageFrame'
      style: primary
      start: 26
      end: 52
    - source: maxWidth
      style: secondary
      start: 26
      end: 34
    - source: layout.pageFrame
      style: secondary
      start: 36
      end: 52
    - source: |-
        stylex.create({
          page: { maxWidth: layout.pageFrame },
        })
      style: secondary
      start: 0
      end: 58
  ? |
    stylex.create({
      page: { maxWidth: { default: '1120px', [container.wide]: '64rem' } },
    })
  : labels:
    - source: 'default: ''1120px'''
      style: primary
      start: 38
      end: 55
    - source: '''1120px'''
      style: secondary
      start: 47
      end: 55
    - source: maxWidth
      style: secondary
      start: 26
      end: 34
    - source: 'maxWidth: { default: ''1120px'', [container.wide]: ''64rem'' }'
      style: secondary
      start: 26
      end: 84
    - source: |-
        stylex.create({
          page: { maxWidth: { default: '1120px', [container.wide]: '64rem' } },
        })
      style: secondary
      start: 0
      end: 90
